{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Salinto{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a2620'/%3E%3Crect x='5' y='6' width='9' height='9' rx='2' fill='%23e0923c'/%3E%3Crect x='18' y='6' width='9' height='9' rx='2' fill='%23e0923c' fill-opacity='0.85'/%3E%3Crect x='5' y='17' width='9' height='9' rx='2' fill='%23e0923c' fill-opacity='0.6'/%3E%3Crect x='18' y='17' width='9' height='9' rx='2' fill='%23e0923c' fill-opacity='0.75'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  {% if messages %}
    <div class="sal-messages">
      {% for message in messages %}
        <div class="sal-message">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
